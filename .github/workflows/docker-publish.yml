# Publish the server image to GHCR from version tags (owner ruling:
# GHCR + semver based on git tags). v1.2.3 -> 1.2.3, 1.2, latest.
# Multi-arch amd64 + arm64 (self-hosting on ARM is a first-class case).
# No secrets required: GITHUB_TOKEN with packages:write.
name: docker-publish

on:
  push:
    tags: ['v[0-9]*']

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta (tags + labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the published image (amd64)
        run: |
          docker pull ${{ env.IMAGE }}:${{ steps.meta.outputs.version }}
          docker run -d --name app -p 3000:3000 ${{ env.IMAGE }}:${{ steps.meta.outputs.version }}
          for i in $(seq 1 30); do curl -sf http://localhost:3000/api/health >/dev/null && break; sleep 1; done
          curl -sf http://localhost:3000/ >/dev/null
          curl -sf http://localhost:3000/style.css >/dev/null
          curl -sf http://localhost:3000/assets/manifest.json | grep -q '"Str1\.0\.svg"'
          curl -sf -X PUT http://localhost:3000/api/tracks/ci-smoke \
            -H 'Content-Type: application/json' \
            -d '{"name":"ci","data":{"track":"Str1;1;1;0;0;0#"}}' >/dev/null
          curl -sf http://localhost:3000/api/tracks/ci-smoke >/dev/null
          echo "image serves, stores, and reads back"
      - name: Container logs (on failure)
        if: failure()
        run: docker logs app || true
