# CI — both test layers on every PR (see TESTPLAN.md), plus the store
# conformance suite against a real postgres. Dev tooling only: nothing
# here ships to the app (the editor stays zero-dep; pg is server-only).
name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Unit (node --test)
        run: npm test

      - name: Syntax check over the module graph
        run: for f in src/*.js serve.js server.js; do node --check "$f"; done

      - name: Install Chromium for Playwright
        run: npx playwright install chromium --with-deps

      - name: E2E (Playwright)
        run: npm run test:e2e

  # The store conformance suite against a real postgres — the sqlite/memory
  # runs happen in `test`; this job is the only live exercise of
  # lib/store/pg.js (int8 handling, upserts, indexes).
  store-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: mini4wd
          POSTGRES_PASSWORD: mini4wd
          POSTGRES_DB: mini4wd
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U mini4wd"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Store conformance (postgres driver)
        env:
          PG_TEST_URL: postgres://mini4wd:mini4wd@localhost:5432/mini4wd
        run: node --test tests/unit/server-store.test.js

  # Build the image and smoke-test the RUNNING container: static pages,
  # baked manifest, and an API roundtrip through the container's sqlite.
  # Until this job existed the Dockerfile was emulation-verified only
  # (no docker binary in dev sandboxes) — this is the real thing.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t mini4wd-editor .
      - name: Run + smoke test
        run: |
          docker run -d --name app -p 3000:3000 mini4wd-editor
          for i in $(seq 1 30); do curl -sf http://localhost:3000/api/health >/dev/null && break; sleep 1; done
          curl -sf http://localhost:3000/ >/dev/null
          curl -sf http://localhost:3000/style.css >/dev/null
          curl -sf http://localhost:3000/src/main.js >/dev/null
          # the manifest must serve AND be non-empty (an empty bake is a
          # 200 that the client cache would treat as all-stale)
          curl -sf http://localhost:3000/assets/manifest.json | grep -q '"Str1\.0\.svg"'
          test "$(curl -s http://localhost:3000/api/health | grep -o '"driver":"[^"]*"')" = '"driver":"sqlite"'
          curl -sf -X PUT http://localhost:3000/api/tracks/ci-smoke \
            -H 'Content-Type: application/json' \
            -d '{"name":"ci","data":{"track":"Str1;1;1;0;0;0#"}}' >/dev/null
          curl -sf http://localhost:3000/api/tracks/ci-smoke >/dev/null
      - name: Container logs (on failure)
        if: failure()
        run: docker logs app || true
