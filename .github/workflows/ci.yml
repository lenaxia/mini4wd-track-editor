# CI — both test layers on every PR (see TESTPLAN.md).
# Dev tooling only: nothing here ships to the app (no build step, no
# runtime deps — README-LLM hard rule 1).
name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Unit (node --test)
        run: npm test

      - name: Syntax check over the module graph
        run: for f in src/*.js serve.js; do node --check "$f"; done

      - name: Install Chromium for Playwright
        run: npx playwright install chromium --with-deps

      - name: E2E (Playwright)
        run: npm run test:e2e
