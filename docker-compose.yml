# Packaging examples:
#   docker compose up                  -> app with local sqlite volume
#   docker compose --profile postgres  -> app + postgres, STORE=postgres
services:
  app:
    build: .
    ports: ["3000:3000"]
    volumes: ["track-data:/data"]
    environment:
      STORE: sqlite
      SQLITE_PATH: /data/tracks.db
  db:
    image: postgres:16-alpine
    profiles: [postgres]
    environment:
      POSTGRES_USER: mini4wd
      POSTGRES_PASSWORD: mini4wd
      POSTGRES_DB: mini4wd
    volumes: ["pg-data:/var/lib/postgresql/data"]

volumes:
  track-data:
  pg-data:
