# Packaging examples:
#   docker compose up                                      -> app + local sqlite volume
#   STORE=postgres POSTGRES_PASSWORD=change-me \
#     DATABASE_URL=postgres://mini4wd:change-me@db:5432/mini4wd \
#     docker compose --profile postgres up                 -> app + postgres
# (the app reads STORE / DATABASE_URL from the environment; unset means
# the sqlite default, so plain `up` never needs the db service. The db
# service requires POSTGRES_PASSWORD — no hardcoded default to leak.)
services:
  app:
    # build: .          # local dev
    image: ghcr.io/lenaxia/mini4wd-track-editor:latest   # published image
    ports: ["3000:3000"]
    volumes: ["track-data:/data"]
    environment:
      STORE: ${STORE:-sqlite}
      SQLITE_PATH: /data/tracks.db
      DATABASE_URL: ${DATABASE_URL:-}
  db:
    image: postgres:16-alpine
    profiles: [postgres]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mini4wd}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-mini4wd}
    volumes: ["pg-data:/var/lib/postgresql/data"]

volumes:
  track-data:
  pg-data:
